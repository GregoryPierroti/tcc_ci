name: CI - Governança da esteira

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Segredos, workflows e imagens
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Verificar segredos versionados
        run: make gitleaks

      - name: Validar workflows GitHub Actions
        run: make actionlint

      - name: Validar Dockerfiles
        run: make hadolint
