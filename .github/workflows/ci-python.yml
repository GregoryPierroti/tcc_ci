name: CI - ETL Python

on:
  pull_request:
    paths:
      - "projects/02_etl_python/**"
      - ".github/workflows/ci-python.yml"
  push:
    branches:
      - main
    paths:
      - "projects/02_etl_python/**"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade, testes e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/02_etl_python

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar configuração local efêmera
        run: cp .env.example .env

      - name: Verificar Docker Compose
        run: docker compose version

      - name: Verificar formatação
        run: make format-check

      - name: Verificar docstrings
        run: make docformat-check

      - name: Executar lint
        run: make lint

      - name: Verificar tipos
        run: make type-check

      - name: Medir complexidade
        run: make complexity

      - name: Verificar código morto
        run: make dead-code

      - name: Verificar fronteiras de arquitetura
        run: make architecture

      - name: Executar testes unitários e de integração
        run: make test

      - name: Publicar relatórios de teste
        if: ${{ always( }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-etl-python
          path: |
            projects/02_etl_python/src/coverage.xml
            projects/02_etl_python/src/junit-*.xml
          if-no-files-found: error

      - name: Auditar dependências
        run: make security

      - name: Gerar SBOM CycloneDX
        run: make sbom

      - name: Publicar SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-etl-python
          path: projects/02_etl_python/src/sbom.cdx.json
          if-no-files-found: error

      - name: Encerrar recursos Docker
        if: always()
        run: docker compose down -v
