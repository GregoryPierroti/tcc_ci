version: 2
baseline_tag: baseline-ci-v2
purpose: >-
  Mutações controladas v2 para engenharia de software em pipelines. Não mede
  qualidade de dados; toda execução parte da tag, usa branch/PR próprios e não
  é integrada ao main.

projects:
  - id: python
    path: projects/02_etl_python
    workflow: CI - ETL Python
    faults:
      - {id: V2-PY-001, category: formatting, target: src/tests/test_orquestracao_unitaria.py, mutation: "Remover linha em branco antes de classe local.", technique: Ruff format, principle: consistência mecânica, expected_detector: Ruff format, expected_stage: Verificar formatação, expected_outcome: detected, independent_confirmation: "ruff format --check retorna não zero.", interpretation_limit: "Formatação não prova correção funcional."}
      - {id: V2-PY-002, category: lint, target: src/pipeline/ingestao_raw.py, mutation: "Referenciar identificador inexistente no processamento.", technique: Ruff, principle: prevenção estática de erro de nome, expected_detector: "Ruff F821", expected_stage: Executar lint, expected_outcome: detected, independent_confirmation: "ruff check reporta F821.", interpretation_limit: "Não cobre resolução exclusivamente dinâmica."}
      - {id: V2-PY-003, category: typing, target: src/pipeline/agregacoes_delivery.py, mutation: "Atribuir texto à porta tipada de persistência.", technique: mypy, principle: contrato entre orquestração e adaptador, expected_detector: mypy, expected_stage: Verificar tipos, expected_outcome: detected, independent_confirmation: "mypy reporta incompatibilidade.", interpretation_limit: "Não valida schemas dinâmicos de DataFrame."}
      - {id: V2-PY-004, category: documentation, target: src/pipeline/transformacoes_trusted.py, mutation: "Desformatar docstring que a ferramenta normalizaria.", technique: pydocstringformatter, principle: documentação executável uniforme, expected_detector: pydocstringformatter, expected_stage: Verificar docstrings, expected_outcome: detected, independent_confirmation: "pydocstringformatter --exit-code retorna não zero.", interpretation_limit: "Formato não garante descrição verdadeira."}
      - {id: V2-PY-005, category: cyclomatic_complexity, target: src/pipeline/ingestao_raw.py, mutation: "Acrescentar ramificações até classificação C.", technique: Radon, principle: limitação de caminhos independentes, expected_detector: Radon, expected_stage: Medir complexidade, expected_outcome: expected_false_negative, independent_confirmation: "radon cc lista classificação C ou superior.", interpretation_limit: "O alvo atual reporta B+ mas não falha o job."}
      - {id: V2-PY-006, category: dead_code, target: src/pipeline/popular.py, mutation: "Adicionar função privada sem referência.", technique: Vulture, principle: remoção de caminhos abandonados, expected_detector: Vulture, expected_stage: Verificar código morto, expected_outcome: detected, independent_confirmation: "vulture confiança 100 lista a função.", interpretation_limit: "Pontos dinâmicos podem gerar falso positivo."}
      - {id: V2-PY-007, category: architecture, target: src/utils/s3_client.py, mutation: "Importar classe de pipeline a partir do adaptador.", technique: import-linter, principle: dependências dirigidas, expected_detector: import-linter, expected_stage: Verificar fronteiras de arquitetura, expected_outcome: detected, independent_confirmation: "lint-imports quebra o contrato de adaptadores.", interpretation_limit: "Cobre somente fronteiras declaradas."}
      - {id: V2-PY-008, category: unit_behavior, target: src/pipeline/transformacoes_trusted.py, mutation: "Trocar normalização para minúsculas.", technique: pytest unitário, principle: regressão determinística, expected_detector: pytest, expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "Teste de normalização falha localmente.", interpretation_limit: "Formato técnico não é qualidade de origem."}
      - {id: V2-PY-009, category: property_test, target: src/pipeline/transformacoes_trusted.py, mutation: "Preservar espaços externos na chave.", technique: Hypothesis, principle: invariantes em entradas variadas, expected_detector: "pytest com Hypothesis", expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "Propriedade gera contraexemplo com espaços.", interpretation_limit: "Entradas geradas não representam produção."}
      - {id: V2-PY-010, category: coverage_gate, target: src/pipeline/agregacoes_delivery.py, mutation: "Criar ramo sem teste até cobertura ficar abaixo de 95%.", technique: pytest-cov, principle: piso de exercitação, expected_detector: pytest-cov, expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "coverage.xml informa total abaixo de 95%.", interpretation_limit: "Cobertura não demonstra ausência de defeitos."}
      - {id: V2-PY-011, category: integration_postgres, target: src/utils/postgres_uploader.py, mutation: "Usar schema inexistente na publicação técnica.", technique: "pytest integração", principle: contrato adaptador-JDBC, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Publicação ou leitura PostgreSQL falha.", interpretation_limit: "Não avalia conteúdo analítico."}
      - {id: V2-PY-012, category: integration_object_storage, target: src/utils/s3_client.py, mutation: "Listar bucket distinto do criado pelo bootstrap.", technique: "pytest integração", principle: contrato cliente-bucket, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Teste MinIO não localiza objeto técnico.", interpretation_limit: "Presença de objeto não valida conteúdo."}
      - {id: V2-PY-013, category: bootstrap, target: docker-compose.yml, mutation: "Remover criação do bucket etl-python no minio-init.", technique: "bootstrap Docker Compose", principle: infraestrutura reproduzível, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Bootstrap seguido de teste MinIO falha por bucket ausente.", interpretation_limit: "Não mede política de produção."}
      - {id: V2-PY-014, category: reexecution, target: src/utils/s3_client.py, mutation: "Fazer ensure_base_structure falhar se bucket existir.", technique: "pytest integração", principle: idempotência técnica, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Duas inicializações consecutivas falham.", interpretation_limit: "Idempotência de recurso não é regra de negócio."}

  - id: pyspark
    path: projects/03_etl_pyspark
    workflow: CI - ETL PySpark
    faults:
      - {id: V2-SP-001, category: lint, target: src/pipeline/ingestao_raw_spark.py, mutation: "Referenciar nome Python inexistente no leitor.", technique: Ruff, principle: erro estático antes do Spark, expected_detector: "Ruff F821", expected_stage: Executar lint, expected_outcome: detected, independent_confirmation: "ruff check reporta F821.", interpretation_limit: "Não valida schemas Spark dinâmicos."}
      - {id: V2-SP-002, category: typing, target: src/pipeline/popular_spark.py, mutation: "Atribuir valor incompatível a base_dir tipado como texto.", technique: mypy, principle: contrato das fronteiras tipáveis Spark, expected_detector: mypy, expected_stage: Verificar tipos, expected_outcome: detected, independent_confirmation: "mypy reporta incompatibilidade.", interpretation_limit: "Não infere colunas Spark."}
      - {id: V2-SP-003, category: unit_behavior, target: src/pipeline/transformacoes_trusted_spark.py, mutation: "Trocar upper por lower na chave.", technique: "pytest unitário Spark", principle: regressão em sessão isolada, expected_detector: pytest, expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "Teste de normalização Spark falha.", interpretation_limit: "Não mede semântica de origem."}
      - {id: V2-SP-004, category: property_test, target: src/pipeline/transformacoes_trusted_spark.py, mutation: "Preservar espaços externos na chave Spark.", technique: Hypothesis, principle: invariantes variados, expected_detector: "pytest com Hypothesis", expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "Propriedade produz exemplo com espaço.", interpretation_limit: "Geração não é perfil de produção."}
      - {id: V2-SP-005, category: coverage_gate, target: src/pipeline/popular_spark.py, mutation: "Introduzir caminho sem teste abaixo de 95%.", technique: pytest-cov, principle: piso de exercitação da orquestração, expected_detector: pytest-cov, expected_stage: Executar testes unitários, expected_outcome: detected, independent_confirmation: "coverage.xml fica abaixo de 95%.", interpretation_limit: "Não mede JVM nem conectores."}
      - {id: V2-SP-006, category: integration_jdbc, target: src/tests/test_integracao_tecnica_spark.py, mutation: "Usar porta JDBC PostgreSQL inexistente.", technique: "pytest integração Spark-JDBC", principle: disponibilidade de adaptador, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Leitura ou escrita JDBC falha por conexão.", interpretation_limit: "Falha de rede não é falha de dados."}
      - {id: V2-SP-007, category: integration_jdbc_contract, target: src/tests/test_integracao_tecnica_spark.py, mutation: "Ler tabela JDBC técnica com nome diferente do publicado.", technique: "pytest integração Spark-JDBC", principle: contrato escrita-leitura, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Leitura JDBC falha por relação ausente.", interpretation_limit: "Relação existente não prova lógica analítica."}
      - {id: V2-SP-008, category: integration_persistence, target: src/pipeline/agregacoes_delivery_spark.py, mutation: "Remover persistência JDBC após criar entrega.", technique: "pytest integração Spark-JDBC", principle: contrato de publicação, expected_detector: pytest, expected_stage: Executar testes de integração, expected_outcome: detected, independent_confirmation: "Teste não encontra a tabela publicada.", interpretation_limit: "Confirma publicação, não qualidade das linhas."}

  - id: dbt
    path: projects/04_etl_dbt
    workflow: CI - ETL dbt
    faults:
      - {id: V2-DBT-001, category: sql_style, target: dbt/project/models/delivery/mod_final.sql, mutation: "Introduzir padrão SQL proibido sem alterar semântica.", technique: SQLFluff, principle: consistência de SQL versionado, expected_detector: SQLFluff, expected_stage: Executar lint SQL, expected_outcome: detected, independent_confirmation: "sqlfluff lint retorna não zero.", interpretation_limit: "Estilo não prova lógica SQL."}
      - {id: V2-DBT-002, category: dbt_graph_contract, target: dbt/project/models/delivery/mod_final.sql, mutation: "Trocar ref válida por modelo inexistente.", technique: "dbt parse", principle: integridade do grafo dbt, expected_detector: "dbt parse", expected_stage: Validar estrutura do projeto dbt, expected_outcome: detected, independent_confirmation: "dbt parse falha para a ref ausente.", interpretation_limit: "Grafo válido não prova resultado SQL."}

  - id: governance
    path: .
    workflow: CI - Governança da esteira
    faults:
      - {id: V2-GOV-001, category: code_security, target: projects/02_etl_python/src/utils/s3_client.py, mutation: "Adicionar subprocess com shell=True em auxiliar.", technique: Bandit, principle: reduzir execução insegura, expected_detector: "Bandit B602", expected_stage: Auditar dependências e segurança, expected_outcome: detected, independent_confirmation: "bandit reporta B602.", interpretation_limit: "Análise heurística não prova ausência de vulnerabilidades."}
      - {id: V2-GOV-002, category: secret_exposure, target: projects/02_etl_python/src/pipeline/popular.py, mutation: "Adicionar token GitHub sintético e inválido reconhecível.", technique: Gitleaks, principle: impedir segredos versionados, expected_detector: Gitleaks, expected_stage: Verificar segredos versionados, expected_outcome: detected, independent_confirmation: "gitleaks reporta somente o padrão sintético sem acesso real.", interpretation_limit: "Assinaturas não identificam todo segredo possível."}
      - {id: V2-GOV-003, category: workflow_configuration, target: .github/workflows/ci-python.yml, mutation: "Introduzir expressão Actions inválida em condição.", technique: Actionlint, principle: correção da automação CI, expected_detector: Actionlint, expected_stage: Validar workflows GitHub Actions, expected_outcome: detected, independent_confirmation: "actionlint retorna não zero.", interpretation_limit: "Sintaxe válida não garante política adequada."}
      - {id: V2-GOV-004, category: container_hygiene, target: projects/03_etl_pyspark/Dockerfile, mutation: "Separar apt-get update da limpeza de listas.", technique: Hadolint, principle: higiene e reprodutibilidade de imagem, expected_detector: Hadolint, expected_stage: Validar Dockerfiles, expected_outcome: detected, independent_confirmation: "hadolint reporta regra violada.", interpretation_limit: "Lint não substitui scanner de imagem ou runtime."}
