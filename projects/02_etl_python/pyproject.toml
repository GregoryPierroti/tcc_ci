[project]
name = "tcc-etl-python"
version = "0.1.0"
description = "Objeto experimental de ETL em pandas para o TCC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3==1.35.92",
  "pandas==2.2.3",
  "psycopg2-binary==2.9.10",
  "python-dotenv==1.2.2",
  "sqlalchemy==2.0.36",
]

[dependency-groups]
dev = [
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
