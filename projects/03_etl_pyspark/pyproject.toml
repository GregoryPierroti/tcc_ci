[project]
name = "tcc-etl-pyspark"
version = "0.1.0"
description = "Objeto experimental de ETL em PySpark para o TCC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyspark==3.5.2",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "hypothesis==6.165.9",
  "import-linter==2.13",
  "mypy==2.3.1",
  "pip==26.2",
  "pip-audit==2.7.3",
  "pydocstringformatter==1.0.0",
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "radon==6.0.1",
  "ruff==0.8.4",
  "vulture==2.16",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
  "unit: teste sem serviços externos",
  "integration: teste com componentes reais do pipeline",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "RUF", "PL"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[tool.pydocstringformatter]
style = ["pep257"]
exclude = ["src/tests/**"]
