[project]
name = "tcc-etl-pyspark"
version = "0.1.0"
description = "Objeto experimental de ETL em PySpark para o TCC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyspark==3.5.2",
]

[dependency-groups]
dev = [
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
