services:
  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-dbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 15

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # dbt vai ler este diretório para o profiles.yml
      DBT_PROFILES_DIR: /root/.dbt
      # variáveis úteis (opcional):
      DBT_TARGET: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-dbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt}
    volumes:
      - ./dbt/project:/app
      - ./dbt/profiles:/root/.dbt    # onde ficará o profiles.yml
      - ./dbt/sqlfluff:/root/.config/sqlfluff  # .sqlfluff e configs
    working_dir: /app
    command: ["dbt", "parse"]

volumes:
  pg_data:
